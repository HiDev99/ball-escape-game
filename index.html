<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Escape Studio</title><link rel="stylesheet" href="style.css"></head><body><main><section class="stage"><div class="brand">BALL ESCAPE <b>STUDIO</b></div><canvas id="game" width="720" height="1280"></canvas><div class="actions"><button id="play">Pause</button><button id="reset">New Round</button><button id="random">Randomize</button><button id="record">Record Short</button></div></section><aside><h1>Custom Generator</h1><p class="sub">Create original 9:16 physics Shorts in your browser.</p><label>Game mode<select id="mode"><option value="race">Escape Race</option><option value="speed">Speed Every Bounce</option><option value="multiply">Multiply Madness</option><option value="rings">Multi Ring Escape</option><option value="survival">Last Trapped Wins</option><option value="gravity">Gravity Chaos</option><option value="portal">Portal Escape</option><option value="shrink">Shrinking Arena</option></select></label><div class="grid"><label>Balls<input id="count" type="range" min="1" max="20" value="4"><span id="countV"></span></label><label>Speed<input id="speed" type="range" min="2" max="14" value="7"><span id="speedV"></span></label><label>Gravity<input id="gravity" type="range" min="0" max="1" step=".02" value=".18"><span id="gravityV"></span></label><label>Gap size<input id="gap" type="range" min="10" max="100" value="38"><span id="gapV"></span></label><label>Ring rotation<input id="rotation" type="range" min="-3" max="3" step=".1" value=".7"><span id="rotationV"></span></label><label>Ball size<input id="size" type="range" min="7" max="25" value="13"><span id="sizeV"></span></label></div><label class="check"><input id="trails" type="checkbox" checked> Neon trails</label><label class="check"><input id="sound" type="checkbox" checked> Bounce sounds</label><label class="check"><input id="labels" type="checkbox" checked> Short title + timer</label><div class="tips"><b>Shorts workflow</b><span>Choose a mode → Randomize → Record Short → let a winner escape → download the WebM recording.</span></div></aside></main><script src="app.js"></script></body></html>
